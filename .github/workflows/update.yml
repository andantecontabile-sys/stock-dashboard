name: 每日更新估值資料

on:
  schedule:
    # cron 一律是 UTC。台北 = UTC+8。
    - cron: "0 9 * * 1-5"    # 台北 17:00 — 台股盤後法人資料已出
    - cron: "0 22 * * 1-5"   # 台北 06:00 — 美股前一日收盤已定
  workflow_dispatch:          # 在 Actions 頁面可手動按一下就跑

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 產生 data/latest.json
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TZ: Asia/Taipei
        run: python scripts/build.py

      - name: 驗證輸出格式（壞掉的 JSON 不准進 main）
        run: |
          python -c "
          import json,sys
          d=json.load(open('data/latest.json'))
          assert d.get('generated_at'), 'generated_at 缺漏'
          assert isinstance(d.get('securities'), list), 'securities 必須是陣列'
          print('OK:', len(d['securities']), '檔標的')
          "

      - name: 提交結果
        run: |
          git config user.name  "dashboard-bot"
          git config user.email "actions@github.com"
          git add data/ inbox/
          git diff --staged --quiet || git commit -m "資料更新 $(date +'%Y-%m-%d %H:%M')"
          git push
