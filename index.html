<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>選股儀表板</title>

<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#0F1523">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="選股儀表板">
<link rel="apple-touch-icon" href="./icons/icon-180.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">

<style>
:root{
  --ink:#0F1523; --surface:#171E2E; --surface-2:#1E2739; --line:#2A3450;
  --text:#E8ECF4; --muted:#93A0BC; --faint:#63708E;
  --under:#6F5CF0; --mid:#2BB3C9; --over:#E8B23A; --warn:#E2574C;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
  --sans:"Noto Sans TC",system-ui,-apple-system,sans-serif;
  --tap:44px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{background:var(--ink);color:var(--text);font-family:var(--sans);
  font-size:15.5px;line-height:1.68;-webkit-font-smoothing:antialiased;overflow-wrap:break-word}

.top-sticky-wrapper{position:fixed !important;top:0 !important;left:0 !important;right:0 !important;width:100% !important;z-index:999999 !important;background:#0F1523 !important;border-bottom:1px solid var(--line) !important;box-shadow:0 4px 20px rgba(0,0,0,.6) !important}
header{padding:calc(env(safe-area-inset-top) + 10px) 16px 6px}
.hrow{display:flex;align-items:center;gap:10px;max-width:680px;margin:0 auto}
h1{font-size:16px;font-weight:700;letter-spacing:.02em;flex:1}
#stamp{font-family:var(--mono);font-size:10.5px;color:var(--faint);text-align:right;line-height:1.4}
#stamp.stale{color:var(--warn)}
#stamp b{display:block;font-weight:500;color:var(--muted)}
#reload{min-width:var(--tap);min-height:var(--tap);display:grid;place-items:center;
  background:var(--surface-2);border:1px solid var(--line);border-radius:9px;
  color:var(--muted);cursor:pointer;flex-shrink:0}
#reload:active{background:var(--line)}
#reload.spin svg{animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

nav{background:var(--surface);border-top:1px solid rgba(42,52,80,.4);padding:6px 12px}
.tabs{display:flex;max-width:680px;margin:0 auto;gap:8px}
.tab{flex:1;min-height:40px;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;
  color:var(--muted);font-family:inherit;font-size:13.5px;font-weight:600;padding:0 8px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:all .2s ease}
.tab[aria-selected="true"]{color:#FFF;background:var(--under);border-color:var(--under);
  box-shadow:0 2px 8px rgba(111,92,240,.4)}

main{max-width:680px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 120px) 16px calc(env(safe-area-inset-bottom) + 56px) !important}
section[hidden]{display:none}
h2{font-size:15px;font-weight:700;margin:26px 0 11px;letter-spacing:.01em}
h2:first-child{margin-top:2px}
.lede{font-size:13.5px;color:var(--muted);margin-bottom:16px;line-height:1.65}

.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:15px;margin-bottom:12px}

.src-top{display:flex;align-items:center;gap:8px;margin-bottom:3px;flex-wrap:wrap}
.src-name{font-size:15.5px;font-weight:700}
.pill{font-family:var(--mono);font-size:10px;padding:2px 7px;border-radius:20px;
  border:1px solid var(--line);color:var(--faint);white-space:nowrap}
.pill.auto{color:var(--mid);border-color:rgba(43,179,201,.4);background:rgba(43,179,201,.09)}
.pill.semi{color:var(--over);border-color:rgba(232,178,58,.4);background:rgba(232,178,58,.09)}
.pill.manual{color:var(--warn);border-color:rgba(226,87,76,.4);background:rgba(226,87,76,.09)}
.src-ch{font-size:12px;color:var(--faint);font-family:var(--mono);margin-bottom:11px;line-height:1.55}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12.5px;padding:4px 10px;border-radius:7px;background:var(--surface-2);
  border:1px solid var(--line);color:var(--text);min-height:30px;display:inline-flex;align-items:center}
.chip.tw{border-color:rgba(111,92,240,.45);background:rgba(111,92,240,.12)}
.chip em{font-style:normal;color:var(--faint);font-family:var(--mono);font-size:11px;margin-left:4px}
.macro{font-size:12.5px;color:var(--muted);margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}

.stk-top{display:flex;align-items:baseline;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.tkr{font-family:var(--mono);font-size:12.5px;color:var(--muted)}
.nm{font-size:18px;font-weight:700}
.mkt{font-family:var(--mono);font-size:9.5px;color:var(--faint);border:1px solid var(--line);
  border-radius:4px;padding:1px 5px;margin-left:auto}
.px{font-family:var(--mono);font-size:25px;font-weight:500;letter-spacing:-.02em;line-height:1.15}
.px .chg{font-size:14px;margin-left:8px}
.chg.up{color:var(--mid)} .chg.dn{color:var(--warn)}
.px .dt{display:block;font-size:10.5px;color:var(--faint);font-weight:400;letter-spacing:0;margin-top:4px;font-family:var(--sans)}

.thesis{margin-top:14px;padding:11px 13px;border-radius:9px;background:var(--surface-2);
  border-left:3px solid var(--muted)}
.thesis.bull{border-left-color:var(--mid)}
.thesis.bear{border-left-color:var(--warn)}
.th-hd{display:flex;align-items:center;gap:7px;margin-bottom:6px;flex-wrap:wrap}
.th-src{font-size:12.5px;font-weight:700}
.th-tag{font-family:var(--mono);font-size:9.5px;padding:1px 6px;border-radius:4px;background:var(--line);color:var(--muted)}
.th-tag.bull{background:rgba(43,179,201,.16);color:var(--mid)}
.th-tag.bear{background:rgba(226,87,76,.16);color:var(--warn)}
.thesis p{font-size:13.5px;line-height:1.7}
.thesis p + p{margin-top:7px}

.news{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.news h4{font-size:11.5px;color:var(--faint);font-weight:500;letter-spacing:.06em;margin-bottom:8px}
.news li{list-style:none;font-size:13px;line-height:1.65;color:var(--muted);
  padding-left:15px;position:relative;margin-bottom:7px}
.news li::before{content:"";position:absolute;left:2px;top:9px;width:4px;height:4px;border-radius:50%;background:var(--faint)}
.news li.alert{color:var(--text)}
.news li.alert::before{background:var(--warn)}

.band-row{display:grid;grid-template-columns:38px 1fr 42px;align-items:center;gap:9px;margin-bottom:9px}
.band-lbl{font-family:var(--mono);font-size:10.5px;color:var(--muted);text-align:right}
.band{position:relative;height:17px;border-radius:4px;
  background:linear-gradient(90deg,var(--under),var(--mid) 52%,var(--over))}
.band.na{background:var(--surface-2)}
.tick{position:absolute;top:-4px;bottom:-4px;width:2.5px;background:var(--text);
  border-radius:2px;box-shadow:0 0 0 2.5px var(--surface)}
.band-val{font-family:var(--mono);font-size:11px;color:var(--muted)}
.band-val.na{color:var(--faint);font-size:10px}
.band-val.out{color:var(--over);font-size:10px}
.tick.edge-r{background:var(--over);width:3.5px}
.tick.edge-l{background:var(--under);width:3.5px}
.scale{display:flex;justify-content:space-between;font-size:9.5px;color:var(--faint);
  margin:-2px 52px 10px 47px;font-family:var(--sans)}

.metrics{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);
  border-radius:9px;overflow:hidden;margin-top:14px}
.metrics div{background:var(--surface);padding:10px 12px}
.metrics dt{font-size:10.5px;color:var(--faint);letter-spacing:.04em;margin-bottom:2px}
.metrics dd{font-family:var(--mono);font-size:16px;font-weight:500}
.hi{color:var(--over)} .lo{color:var(--mid)}

.flags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.flag{font-size:11.5px;padding:3px 9px;border-radius:6px;color:var(--over);
  background:rgba(232,178,58,.11);border:1px solid rgba(232,178,58,.32)}
.flag.miss{color:var(--warn);background:rgba(226,87,76,.11);border-color:rgba(226,87,76,.32)}

.alertbox{background:rgba(226,87,76,.08);border:1px solid rgba(226,87,76,.32);
  border-radius:11px;padding:14px 15px;margin-bottom:14px}
.alertbox h3{font-size:13.5px;color:var(--warn);margin-bottom:8px;font-weight:700}
.alertbox li{font-size:13px;line-height:1.65;margin-left:18px;margin-bottom:7px}

details{margin-top:12px;border-top:1px solid var(--line);padding-top:4px}
summary{min-height:var(--tap);display:flex;align-items:center;gap:7px;font-size:13px;
  color:var(--muted);cursor:pointer;list-style:none;font-weight:500}
summary::-webkit-details-marker{display:none}
summary::before{content:"▸";color:var(--faint);transition:transform .18s;display:inline-block}
details[open] summary::before{transform:rotate(90deg)}
details p{font-size:13px;color:var(--muted);line-height:1.7;margin-bottom:8px;padding-left:14px}

.disc{font-size:11.5px;color:var(--faint);line-height:1.75;margin-top:28px;
  padding-top:15px;border-top:1px solid var(--line)}
.empty{color:var(--muted);text-align:center;padding:64px 20px;font-size:14px;line-height:1.9}

@media (min-width:600px){
  .metrics{grid-template-columns:repeat(4,1fr)}
  body{font-size:16px}
}
@media (prefers-reduced-motion:no-preference){
  .card,.alertbox{animation:rise .3s cubic-bezier(.2,.7,.3,1) backwards}
}
@keyframes rise{from{opacity:0;transform:translateY(7px)}}
</style>
</head>
<body>

<div class="top-sticky-wrapper">
  <header>
    <div class="hrow">
      <h1>選股儀表板</h1>
      <div id="stamp"><b>載入中</b></div>
      <button id="reload" aria-label="重新整理">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
          <path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/>
        </svg>
      </button>
    </div>
  </header>

  <nav>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" aria-selected="true"  data-p="1">來源與標的</button>
      <button class="tab" role="tab" aria-selected="false" data-p="2">個股論述</button>
      <button class="tab" role="tab" aria-selected="false" data-p="3">估值與操作</button>
    </div>
  </nav>
</div>

<main>
  <section id="p1"><p class="empty">正在取得最新資料…</p></section>
  <section id="p2" hidden></section>
  <section id="p3" hidden></section>
  <p class="disc" id="disc"></p>
</main>

<script>
const MODELS=[["pe","P/E"],["pb","P/B"],["peg","PEG"],["ddm","DDM"],["dcf","DCF"]];
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const num=n=>(n==null||!isFinite(n))?"—":(Math.abs(n)>=1000?n.toFixed(0):n.toFixed(2).replace(/\.?0+$/,""));
const pos=(p,lo,hi)=>(!isFinite(p)||!isFinite(lo)||!isFinite(hi)||hi<=lo)?null:Math.min(1,Math.max(0,(p-lo)/(hi-lo)));

function renderSources(d){
  const map={auto:["全自動","auto"],semi:["半自動","semi"],manual:["手動匯入","manual"]};
  const cards=(d.sources||[]).map(s=>{
    const [txt,cls]=map[s.automation]||map.manual;
    const chips=(s.tickers||[]).map(t=>
      `<span class="chip ${(t.market==="TWSE"||t.market==="TPEX")?"tw":""}">${esc(t.name||t.ticker)}<em>${esc(t.ticker)}</em></span>`).join("");
    return `<article class="card">
      <div class="src-top"><span class="src-name">${esc(s.name)}</span><span class="pill ${cls}">${txt}</span></div>
      <div class="src-ch">${esc(s.channel||"")}</div>
      ${chips?`<div class="chips">${chips}</div>`:`<p class="src-ch" style="margin:0">本期無個股點名</p>`}
      ${s.themes?`<p class="macro">主題層級：${esc(s.themes)}</p>`:""}
    </article>`;
  }).join("");
  const nw=d.new_candidates||[];
  const newBox=nw.length?`<h2>本期新增候選</h2><article class="card"><div class="chips">${
    nw.map(t=>`<span class="chip">${esc(t.name||t.ticker)}<em>${esc(t.ticker)}</em></span>`).join("")
  }</div><p class="macro">由來源點名但尚未納入估值分析</p></article>`:"";
  return `<h2>資訊來源與提及標的</h2>
    <p class="lede">Facebook 粉專無法自動存取，內容改由各作者的公開出口取得。粉專限定的貼文請用 iOS 捷徑送進 inbox。</p>
    ${cards}${newBox}`;
}

function renderTheses(d){
  return `<h2>個股論述與時事</h2>
    <p class="lede">各來源對同一標的的說法並列。立場相反時不做調和——分歧本身就是訊號。</p>` +
  (d.securities||[]).map(s=>{
    const th=(s.theses||[]).map(t=>{
      const st=t.stance==="bullish"?"bull":t.stance==="bearish"?"bear":"";
      const tag={bullish:"看多",bearish:"看空"}[t.stance]||"中性";
      return `<div class="thesis ${st}">
        <div class="th-hd"><span class="th-src">${esc(t.source)}</span><span class="th-tag ${st}">${tag}</span>
        ${t.ref&&t.ref!=="—"?`<span class="th-tag">${esc(t.ref)}</span>`:""}</div>
        ${(t.points||[]).map(p=>`<p>${esc(p)}</p>`).join("")}</div>`;
    }).join("");
    const news=(s.news||[]).map(n=>`<li class="${n.alert?"alert":""}">${esc(n.text||n)}</li>`).join("");
    const c=s.change;
    return `<article class="card">
      <div class="stk-top"><span class="tkr">${esc(s.ticker)}</span><span class="nm">${esc(s.name)}</span><span class="mkt">${esc(s.market)}</span></div>
      <div class="px">${num(s.price)}${c!=null?`<span class="chg ${c>=0?"up":"dn"}">${c>=0?"+":""}${c.toFixed(2)}%</span>`:""}
        <span class="dt">${esc(s.price_date||"")}　資料源 ${esc(s.price_source||"—")}</span></div>
      ${th}${news?`<div class="news"><h4>近期時事</h4><ul>${news}</ul></div>`:""}
    </article>`;
  }).join("");
}

function renderValuation(d){
  const warn=(d.must_verify||[]).length?`<div class="alertbox"><h3>決策前必須自行查證</h3>
    <ol>${d.must_verify.map(x=>`<li>${esc(x)}</li>`).join("")}</ol></div>`:"";
  const cards=(d.securities||[]).map(s=>{
    const bands=MODELS.map(([k,l])=>{
      const m=s.models&&s.models[k];
      if(!m||m.applicable===false||!isFinite(m.low)||!isFinite(m.high))
        return `<div class="band-row"><span class="band-lbl">${l}</span><div class="band na"></div><span class="band-val na">不適用</span></div>`;
      const raw=(s.price-m.low)/(m.high-m.low), p=Math.min(1,Math.max(0,raw));
      const over=raw>1, under=raw<0;
      const lbl=over?`超出 ${(raw*100-100).toFixed(0)}%`:(under?"低於":`${(p*100).toFixed(0)}%`);
      return `<div class="band-row"><span class="band-lbl">${l}</span>
        <div class="band"><span class="tick${over?" edge-r":""}${under?" edge-l":""}" style="left:calc(${(3+p*94).toFixed(1)}% - 1.25px)"></span></div>
        <span class="band-val${over?" out":""}">${lbl}</span></div>`;
    }).join("");
    const pe28=s.implied_pe_2028, cv=s.divergence_cv, below=s.models_below_price;
    const flags=(s.warnings||[]).map(w=>`<span class="flag">${esc(w)}</span>`).join("")
      +(s.missing||[]).map(w=>`<span class="flag miss">${esc(w)}</span>`).join("");
    return `<article class="card">
      <div class="stk-top"><span class="tkr">${esc(s.ticker)}</span><span class="nm">${esc(s.name)}</span><span class="mkt">${esc(s.market)}</span></div>
      <div class="px">${num(s.price)}<span class="dt">現價在五模型估值區間中的位置</span></div>
      ${bands}<div class="scale"><span>低估</span><span>合理</span><span>高估</span></div>
      <dl class="metrics">
        <div><dt>隱含 2028 P/E</dt><dd class="${pe28>28?"hi":(pe28<10?"lo":"")}">${isFinite(pe28)?pe28.toFixed(1)+"x":"—"}</dd></div>
        <div><dt>模型分歧 CV</dt><dd class="${cv>.3?"hi":""}">${isFinite(cv)?cv.toFixed(2):"—"}</dd></div>
        <div><dt>低於現價模型數</dt><dd class="${below>=4?"hi":""}">${below??"—"}<span style="color:var(--faint)">/${s.models_usable??5}</span></dd></div>
        <div><dt>觀察等級</dt><dd>${s.watch_score??"—"}<span style="color:var(--faint)">/${s.watch_max??7}</span></dd></div>
      </dl>
      ${flags?`<div class="flags">${flags}</div>`:""}
      ${s.action?`<details><summary>操作參考與風險</summary>
        ${(s.action.notes||[]).map(n=>`<p>${esc(n)}</p>`).join("")}</details>`:""}
    </article>`;
  }).join("");
  return `<h2>估值與操作參考</h2>
    <p class="lede">估值區間為模型輸出，非目標價。觀察等級為事後統計，不具預測性。</p>${warn}${cards}`;
}

let busy=false;
async function load(force){
  if(busy) return; busy=true;
  const btn=document.getElementById("reload"), stamp=document.getElementById("stamp");
  btn.classList.add("spin");
  try{
    if(force){
      stamp.innerHTML="<b>自動抓取與更新中...</b>";
      try {
        await fetch("/api/update",{method:"POST"});
      }catch(e){ console.warn("API call:", e); }
    }
    const r=await fetch("./data/latest.json?t="+Date.now(),{cache:"no-store"});
    if(!r.ok) throw new Error("HTTP "+r.status);
    const d=await r.json();
    stamp.innerHTML=`<b>${esc(d.generated_at||"時間未知")}</b>${esc(d.trading_day||"")}`;
    const age=d.generated_at?(Date.now()-new Date(d.generated_at.replace(" ","T")+"+08:00"))/36e5:0;
    stamp.classList.toggle("stale",age>30);
    document.getElementById("p1").innerHTML=renderSources(d);
    document.getElementById("p2").innerHTML=renderTheses(d);
    document.getElementById("p3").innerHTML=renderValuation(d);
    document.getElementById("disc").textContent=
      "本頁為公開資料整理與模型輸出，非投資建議。模型結果為輸入假設的函數，更換一組成長率或折現率可使結果變動三成以上。"
      +"籌碼指標在除權息、指數調整、ETF 換股與借券還券日易產生假訊號。";
  }catch(e){
    stamp.innerHTML="<b>更新失敗</b>"; stamp.classList.add("stale");
    document.getElementById("p1").innerHTML=
      `<p class="empty">拿不到 data/latest.json（${esc(e.message)}）<br>請檢查 GitHub Actions 上次執行是否成功。</p>`;
  }finally{ btn.classList.remove("spin"); busy=false; }
}

document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>{
  document.querySelectorAll(".tab").forEach(x=>x.setAttribute("aria-selected",x===t));
  [1,2,3].forEach(i=>document.getElementById("p"+i).hidden=(String(i)!==t.dataset.p));
  window.scrollTo({top:0});
}));
document.getElementById("reload").addEventListener("click",()=>load(true));
load(false);
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) load(false); });
if("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js").catch(()=>{});
</script>
</body>
</html>
